<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>原神 圖鑒</title>
<style>
:root{
  --bg:#12131a; --bg2:#191b25; --card:#20222e; --line:#2e3140;
  --txt:#e8e9f0; --dim:#9aa0b5; --gold:#e8c56a;
  --e-風:#74c2a8; --e-岩:#fab632; --e-雷:#b08fc4; --e-草:#a5c83b;
  --e-水:#4cc2f1; --e-火:#ef7a35; --e-冰:#8fe3ee; --e-無:#8b90a6;
  --r5:linear-gradient(160deg,#a2703c,#e0aa5a); --r4:linear-gradient(160deg,#5c4a8a,#9a72c4);
  --r3:linear-gradient(160deg,#3a5a7a,#5b8fb8); --r2:linear-gradient(160deg,#3a6152,#5f9b7d);
  --r1:linear-gradient(160deg,#4a4e5e,#767c90);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;}
header{position:sticky;top:0;z-index:30;background:rgba(18,19,26,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head-in{max-width:1500px;margin:0 auto;padding:12px 18px 8px}
.brand{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:19px;letter-spacing:2px}
h1 span{color:var(--gold)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
  padding:5px 12px;font-size:14px;cursor:pointer;font-family:inherit;letter-spacing:1px}
.nav button.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
.sub{color:var(--dim);font-size:12px;margin-top:4px}
.tools{display:flex;gap:9px;align-items:center;margin-top:9px;flex-wrap:wrap}
input[type=search],select,input[type=number]{background:var(--bg2);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:7px 11px;font-size:13px;font-family:inherit}
input[type=search]{min-width:180px}
.btn{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:8px;
  padding:7px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{color:var(--txt);border-color:#4a4e63}
.btn.on{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700}
.btn.gold{background:var(--gold);color:#1a1a1a;border-color:var(--gold);font-weight:700}
.filters{max-width:1500px;margin:0 auto;padding:4px 18px 12px;display:none;
  max-height:min(58vh,520px);overflow-y:auto}
.filters.open{display:block}
.frow{display:flex;gap:6px;align-items:flex-start;padding:5px 0;flex-wrap:wrap}
.flabel{color:var(--dim);font-size:12px;min-width:58px;padding-top:6px;letter-spacing:1px;flex:none}
.chip{background:var(--bg2);border:1px solid var(--line);color:var(--dim);border-radius:20px;
  padding:4px 12px;font-size:12.5px;cursor:pointer;user-select:none;transition:.12s;
  font-family:inherit;display:inline-flex;align-items:center;gap:5px}
.chip:hover{color:var(--txt);background:#252838}
/* 下拉選項選中＝金色反白 */
.chip.on{background:var(--gold);color:#17181f !important;border-color:#f5dc9a;font-weight:700;
  box-shadow:0 0 0 2px rgba(232,197,106,.25)}
.chip img{width:15px;height:15px;filter:brightness(0) invert(1);opacity:.85}
.chip.on img{filter:brightness(0);opacity:.9}
/* 「篩選條件」按鈕本身＝白底黑字反白 */
#tgl{background:#fff;color:#15161d;border-color:#fff;font-weight:700}
#tgl:hover{background:#e6e8f0;color:#15161d;border-color:#e6e8f0}
.hint{color:#6f7488;font-size:11.5px;padding:2px 0 0 58px;line-height:1.6}
/* 篩選面板底部的收起條：手機上可以直接往上收 */
.fclose{position:sticky;bottom:0;margin:10px -18px -12px;padding:10px 0 14px;
  background:linear-gradient(180deg,rgba(18,19,26,0) 0%,rgba(18,19,26,.96) 45%,rgba(18,19,26,1) 100%);
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
  color:var(--dim);font-size:12.5px;user-select:none;letter-spacing:1px;
  border-top:1px solid transparent}
.fclose:hover{color:var(--txt)}
.fclose .fbar{width:46px;height:4px;border-radius:3px;background:#4a4e63}
.fclose:hover .fbar{background:#7b8199}
main{max-width:1500px;margin:0 auto;padding:14px 18px 60px}
.count{color:var(--dim);font-size:12.5px;margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  cursor:pointer;transition:.15s;position:relative}
.card:hover{transform:translateY(-3px);border-color:#5b607a;box-shadow:0 8px 22px rgba(0,0,0,.5)}
.por{position:relative;aspect-ratio:1;background:var(--r4)}
.card[data-r="5"] .por{background:var(--r5)}
.card[data-r="3"] .por{background:var(--r3)}
.card[data-r="2"] .por{background:var(--r2)}
.card[data-r="1"] .por{background:var(--r1)}
.por img.av{width:100%;height:100%;object-fit:cover;display:block}
.por img.eq{width:100%;height:100%;object-fit:contain;display:block;padding:6px}
.el{position:absolute;left:4px;top:4px;width:25px;height:25px;border-radius:50%;
  display:grid;place-items:center;background:rgba(12,14,20,.72);box-shadow:0 1px 5px rgba(0,0,0,.6)}
.el img{width:19px;height:19px;display:block}
.star{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.55);border-radius:10px;
  padding:1px 6px;font-size:11px;color:var(--gold);font-weight:700}
.role{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;font-size:11px;
  padding:2px 7px;border-radius:0 8px 0 0;letter-spacing:.5px}
.nm{padding:7px 8px 8px;text-align:center}
.nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--dim);font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--dim);text-align:center;padding:60px 0}
/* ── 詳情視窗 ── */
.mask{position:fixed;inset:0;background:rgba(6,7,12,.86);backdrop-filter:blur(4px);
  display:none;z-index:50;align-items:center;justify-content:center;padding:20px}
.mask.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:1020px;
  width:100%;max-height:90vh;display:grid;grid-template-columns:320px 1fr;overflow:hidden}
.modal.eq{grid-template-columns:1fr;max-width:820px}
.msplash{background:var(--r4);position:relative}
.modal[data-r="5"] .msplash{background:var(--r5)}
.modal[data-r="3"] .msplash{background:var(--r3)}
.modal[data-r="2"] .msplash{background:var(--r2)}
.modal[data-r="1"] .msplash{background:var(--r1)}
.msplash img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.mright{display:flex;flex-direction:column;min-width:0;max-height:90vh}
.mhead{padding:16px 22px 0;position:relative}
.mhead h2{margin:0;font-size:24px}
.mdesc{color:var(--gold);font-size:13px;margin:5px 0 12px}
/* 武器／聖遺物：圖左標題右 */
.eqhead{display:flex;gap:16px;align-items:center;padding:18px 22px 4px}
.eqhead .pic{width:96px;height:96px;flex:none;border-radius:12px;display:grid;place-items:center;
  background:var(--r4);overflow:hidden}
.modal[data-r="5"] .eqhead .pic{background:var(--r5)}
.modal[data-r="3"] .eqhead .pic{background:var(--r3)}
.modal[data-r="2"] .eqhead .pic{background:var(--r2)}
.modal[data-r="1"] .eqhead .pic{background:var(--r1)}
.eqhead .pic img{width:84%;height:84%;object-fit:contain}
.eqhead .txt2{min-width:0}
.eqhead h2{margin:0;font-size:22px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 22px;flex-wrap:wrap}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);
  padding:8px 11px;font-size:13.5px;cursor:pointer;font-family:inherit}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:700}
.mbody{padding:18px 22px 24px;overflow-y:auto;flex:1}
.modal.eq .mbody{max-height:calc(90vh - 190px)}
.kv{display:grid;grid-template-columns:82px 1fr;gap:9px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--dim)}
.kv dd{margin:0}
.eline{display:inline-flex;align-items:center;gap:6px}
.eline img{width:18px;height:18px;filter:brightness(0) invert(1);opacity:.9}
.tags{margin-top:15px;display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#2b2f3f;border-radius:14px;padding:3px 10px;font-size:12px;color:#c9cee0}
.tag.fn{background:#2a3b45;color:#9fd7e6}
.tag.re{background:#3a2f45;color:#d3b3e8}
.sec{margin-bottom:20px}
.sec h3{font-size:13px;color:var(--gold);margin:0 0 9px;letter-spacing:1.5px;
  border-left:3px solid var(--gold);padding-left:8px}
.sk{background:#1f2130;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:9px}
.sk .skh{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.sk .kind{background:#333a52;color:#c3cae4;font-size:11px;border-radius:5px;padding:1px 7px;flex:none}
.sk .kind.a{background:#4a3a22;color:#f0cf94}
.sk .kind.p{background:#243c33;color:#9fdcbd}
.sk b.nmm{font-size:14px}
.sk .cd{color:var(--dim);font-size:11.5px}
.sk .txt{font-size:12.8px;line-height:1.75;color:#c8ccdd}
.sk.key{border-color:#6d5a2c;background:#251f17}
.cnum{background:#3a3f57;color:#dfe3f2;border-radius:5px;font-size:11px;padding:1px 7px;flex:none}
.sk.key .cnum{background:var(--gold);color:#1a1a1a;font-weight:700}
.keytip{color:var(--gold);font-size:12px;margin-left:auto}
/* 配裝：帶圖示的項目 */
.blist{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.bi{display:flex;align-items:center;gap:8px;background:#1f2130;border:1px solid var(--line);
  border-radius:10px;padding:6px 12px 6px 6px;font-size:13px}
.bi .ic{width:38px;height:38px;flex:none;border-radius:7px;display:grid;place-items:center;background:var(--r4)}
.bi[data-r="5"] .ic{background:var(--r5)}
.bi[data-r="4"] .ic{background:var(--r4)}
.bi .ic img{width:86%;height:86%;object-fit:contain}
.bi i{font-style:normal;color:var(--dim);font-size:11.5px;display:block}
.bi.first{border-color:#6d5a2c}
.bi.first b{color:#f0d79c}
.bi.link{cursor:pointer}
.bi.link:hover{border-color:#8a90ad;background:#262a3a}
.warn{background:#2a2419;border:1px solid #5c4a25;color:#e2c88b;font-size:12.2px;
  border-radius:8px;padding:9px 12px;margin-bottom:14px;line-height:1.65}
/* 返回／關閉列：獨立一條，不壓在圖片或標題上 */
.mtop{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 14px;
  border-bottom:1px solid var(--line);background:#1c1e29;min-height:44px}
.mtop .sp{flex:1}
.close{background:#252838;border:1px solid var(--line);color:var(--dim);
  font-size:19px;line-height:1;width:30px;height:30px;border-radius:8px;cursor:pointer;flex:none}
.close:hover{color:#fff;border-color:#5b607a}
.backbtn{background:#2b2f3f;border:1px solid #4a4e63;color:#dfe3f2;font-size:12.5px;
  padding:5px 12px;border-radius:16px;cursor:pointer;font-family:inherit;flex:none;
  max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.backbtn:hover{background:#3a3f57;color:#fff}
/* 天賦／命座旁的功能標註 */
.fnb{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.fnb span{background:#2a3b45;color:#9fd7e6;font-size:10.5px;border-radius:5px;padding:1px 6px;white-space:nowrap}
/* 面板 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin-bottom:6px}
.stat{background:#1f2130;border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.stat small{color:var(--dim);font-size:11.5px;display:block}
.stat b{font-size:17px;font-weight:700}
.goal{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  background:#1f2130;border:1px solid var(--line);border-radius:9px;padding:9px 12px;margin-bottom:7px;flex-wrap:wrap}
.goal .g1{font-size:13.5px}
.goal .g2{font-size:16px;color:var(--gold);font-weight:700;margin-left:auto}
.goal .g3{flex-basis:100%;color:var(--dim);font-size:11.5px;line-height:1.55}
.slots{display:grid;grid-template-columns:46px 1fr;gap:7px 10px;font-size:13.5px;align-items:center}
.slots dt{color:var(--dim)}
.slots dd{margin:0}
.subq{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.subq span{background:#2b2f3f;border-radius:6px;padding:3px 9px;font-size:12.5px}
.subq span:first-child{background:#4a3a22;color:#f0cf94}
/* 素材 */
.mat{display:flex;align-items:center;gap:8px;background:#1f2130;border:1px solid var(--line);
  border-radius:8px;padding:5px 9px 5px 5px;font-size:12.5px}
.mat img{width:32px;height:32px;object-fit:contain;border-radius:5px;background:#2b2f3f}
.mat b{font-weight:600}
.mat i{font-style:normal;color:var(--gold)}
.matrow{margin-bottom:11px}
.matrow .mh{color:var(--dim);font-size:12px;margin-bottom:5px}
.matlist{display:flex;flex-wrap:wrap;gap:6px}
/* ── 培養計算機 ── */
.calcwrap{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:start}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{margin:0 0 12px;font-size:16px;letter-spacing:1px}
.panel h2 small{color:var(--dim);font-size:12px;font-weight:400;letter-spacing:0}
.goalcard{background:#1f2130;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gh .ic{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--r4)}
.gh[data-r="5"] .ic{background:var(--r5)}
.gh .ic img{width:100%;height:100%;object-fit:cover}
.gh b{font-size:15px}
.gh .del{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);
  border-radius:7px;padding:3px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.gh .del:hover{color:#ff9b9b;border-color:#6b3a3a}
.grow{display:grid;grid-template-columns:64px 1fr;gap:8px 10px;align-items:center;margin-bottom:8px;font-size:13px}
.grow>span{color:var(--dim);font-size:12.5px}
.gsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gsel select{padding:5px 8px;font-size:12.5px}
.gsel .arrow{color:var(--dim);font-size:12px}
.tal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tal>div{background:#252838;border-radius:8px;padding:6px 8px}
.tal small{color:var(--dim);font-size:11px;display:block;margin-bottom:3px}
.need{display:flex;align-items:center;gap:9px;background:#1f2130;border:1px solid var(--line);
  border-radius:9px;padding:6px 11px 6px 6px;margin-bottom:6px}
.need img{width:36px;height:36px;object-fit:contain;border-radius:6px;background:#2b2f3f;flex:none}
.need .n1{flex:1;min-width:0}
.need .n1 b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.need .n1 small{color:var(--dim);font-size:11px}
.need input{width:66px;text-align:right;padding:5px 7px;font-size:12.5px}
.need .lack{font-size:15px;font-weight:700;min-width:52px;text-align:right}
.lack.ok{color:#7fd6a0}
.lack.no{color:#ff9b9b}
.craftnote{color:#9fd7e6;font-size:11px}
.sumrow{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-top:1px solid var(--line)}
.sumrow b{color:var(--gold)}
.emptycalc{color:var(--dim);text-align:center;padding:36px 0;line-height:1.9}
/* 素材依合成鏈分組 */
.mgroup{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:10px;background:#1b1d28}
.mgroup .gt{color:#9fd7e6;font-size:11.5px;margin:2px 4px 7px;display:flex;align-items:center;gap:6px}
.mgroup .gt b{color:var(--dim);font-weight:400}
.mgroup .need{margin-bottom:5px;background:#232634}
.mgroup .need:last-child{margin-bottom:0}
/* 角色／武器挑選器 */
.pick{position:fixed;inset:0;background:rgba(6,7,12,.86);backdrop-filter:blur(4px);
  display:none;z-index:60;align-items:center;justify-content:center;padding:20px}
.pick.open{display:flex}
.pickbox{background:var(--bg2);border:1px solid var(--line);border-radius:16px;
  width:100%;max-width:920px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.pickhead{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pickhead b{font-size:15px}
.pickhead input{flex:1;min-width:150px}
.pickbody{overflow-y:auto;padding:14px 16px 18px}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.pickgrid .card .nm{padding:5px 4px 6px}
.pickgrid .card .nm b{font-size:12px}
@media(max-width:700px){ .pickgrid{grid-template-columns:repeat(4,1fr);gap:7px} }
@media(max-width:1000px){ .calcwrap{grid-template-columns:1fr} }
@media(max-width:820px){
  .modal{grid-template-columns:1fr;max-height:92vh;overflow-y:auto}
  .msplash{height:250px}
  .mright{max-height:none}
  .mbody,.modal.eq .mbody{overflow:visible;max-height:none}
  .flabel{min-width:100%;padding-top:0}
  .hint{padding-left:0}
}
@media(max-width:700px){
  /* 手機：圖鑒一排最多四個 */
  .grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .nm{padding:5px 4px 6px}
  .nm b{font-size:11.5px}
  .nm small{font-size:9.5px}
  .el{width:20px;height:20px;left:3px;top:3px}
  .el img{width:15px;height:15px}
  .star{font-size:9.5px;padding:0 4px;right:3px;top:3px}
  .role{font-size:9.5px;padding:1px 5px}
  .eqhead{padding:14px 16px 2px;gap:12px}
  .eqhead .pic{width:72px;height:72px}
  .eqhead h2{font-size:18px}
  .mhead,.tabs,.mbody{padding-left:16px;padding-right:16px}
  .tal{grid-template-columns:1fr}
}
@media(max-width:400px){ .grid{gap:6px} .nm b{font-size:10.5px} }
</style>
</head>
<body>
<header>
  <div class="head-in">
    <div class="brand">
      <h1>原神 <span>圖鑒</span></h1>
      <div class="nav" id="nav">
        <button data-v="char" class="on">角色</button>
        <button data-v="weapon">武器</button>
        <button data-v="artifact">聖遺物</button>
        <button data-v="calc">培養計算</button>
      </div>
    </div>
    <div class="sub" id="sub">載入中…</div>
    <div class="tools" id="tools">
      <input type="search" id="q" placeholder="搜尋…">
      <select id="sort"></select>
      <button class="btn" id="tgl">篩選條件 ▾</button>
      <button class="btn on" id="trv">顯示旅行者</button>
      <button class="btn" id="rst">清除篩選</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main>
  <div id="codex">
    <div class="count" id="count"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="calcview" style="display:none"></div>
</main>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="pick" id="pick"><div class="pickbox">
  <div class="pickhead"><b id="picktitle">選擇</b><input type="search" id="pickq" placeholder="搜尋…">
    <button class="btn" id="pickclose">關閉</button></div>
  <div class="pickbody"><div class="pickgrid" id="pickgrid"></div></div>
</div></div>

<script src="data/characters.js"></script>
<script src="data/weapons.js"></script>
<script src="data/artifacts.js"></script>
<script src="data/materials.js"></script>
<script>
const D = window.CHARACTERS || [], W = window.WEAPONS || [], A = window.ARTIFACTS || [];
const MAT = (window.MATERIALS || {}).素材 || {};
const CHAINS = (window.MATERIALS || {}).合成鏈 || [];
const EXPT = (window.MATERIALS || {}).經驗 || {};
const wByName = Object.fromEntries(W.map(w => [w.名稱, w]));
const wByName2 = Object.fromEntries(W.map(w => [w.id, w]));
const aByName = Object.fromEntries(A.map(a => [a.名稱, a]));
const EL_ORDER = ['風','岩','雷','草','水','火','冰','無'];
const EL_ICON = { 風:'Wind', 岩:'Rock', 雷:'Electric', 草:'Grass', 水:'Water', 火:'Fire', 冰:'Ice' };
const ROLE_ORDER = ['主C','副C','輔助','治療','護盾'];
const FN_ORDER = ['團隊增傷','減抗','減防','攻擊力加成','暴擊加成','精通加成','生命值加成','防禦力加成',
                  '充能支援','治療','護盾','元素附魔','聚怪','減傷','抗打斷'];
const RE_ORDER = ['月綻放','月感電','月結晶','星爍','星擴散','星超導','夜魂'];
const WTYPE_ORDER = ['單手劍','雙手劍','長柄武器','弓','法器'];
const uniq = a => [...new Set(a)];
const sortBy = o => (a, b) => { const i = o.indexOf(a), j = o.indexOf(b); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); };
const elIcon = el => EL_ICON[el] ? '<img src="images/element/' + EL_ICON[el] + '.png" alt="' + el + '">' : '';
const esc = s => String(s).replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);

// ── 三個圖鑒檢視 ──────────────────────────────────────
const VIEWS = {
  char: {
    data: D, ph: '搜尋角色 / 標籤 / 武器 / 聖遺物…',
    sorts: [['new','上線日：新 → 舊'],['old','上線日：舊 → 新'],['rank','星級 → 元素'],
            ['elem','元素 → 星級'],['role','定位 → 星級'],['name','名稱']],
    groups: [
      { label:'元素', key:'元素', mode:'val', vals:EL_ORDER, icon:true },
      { label:'武器', key:'武器', mode:'val', vals:WTYPE_ORDER },
      { label:'星級', key:'星級', mode:'val', vals:[5,4] },
      { label:'定位', key:'定位', mode:'val', vals:uniq(D.map(c => c.定位)).sort(sortBy(ROLE_ORDER)) },
      { label:'特殊體系', key:'特殊體系', mode:'arr', vals:uniq(D.flatMap(c => c.特殊體系)).sort(sortBy(RE_ORDER)) },
      { label:'技能功能', key:'功能', mode:'fn', vals:uniq(D.flatMap(c => Object.keys(c.功能))).sort(sortBy(FN_ORDER)) },
      { label:'成長屬性', key:'成長屬性', mode:'val', vals:['攻擊力','生命值','防禦力','元素精通'] },
      { label:'性別', key:'性別', mode:'val', vals:['男','女'] },
      { label:'體型', key:'體型', mode:'val', vals:['少年','成男','蘿莉','少女','成女'] },
      { label:'年齡', key:'年齡層', mode:'val', vals:['少年','成年'] },
      { label:'地區', key:'地區', mode:'val', vals:uniq(D.map(c => c.地區)) },
    ],
    search: c => [c.名稱, c.原名, c.標籤.join(''), c.特色, c.元素EN, c.地區, c.定位,
                  c.特殊體系.join(''), c.聖遺物.join(''), c.武器推薦.join(''), Object.keys(c.功能).join('')].join(''),
    cmp: {
      new: (a,b) => b.上線日.localeCompare(a.上線日),
      old: (a,b) => a.上線日.localeCompare(b.上線日),
      rank:(a,b) => b.星級-a.星級 || EL_ORDER.indexOf(a.元素)-EL_ORDER.indexOf(b.元素) || a.上線日.localeCompare(b.上線日),
      elem:(a,b) => EL_ORDER.indexOf(a.元素)-EL_ORDER.indexOf(b.元素) || b.星級-a.星級 || a.上線日.localeCompare(b.上線日),
      role:(a,b) => ROLE_ORDER.indexOf(a.定位)-ROLE_ORDER.indexOf(b.定位) || b.星級-a.星級 || a.上線日.localeCompare(b.上線日),
      name:(a,b) => a.名稱.localeCompare(b.名稱,'zh-Hant'),
    },
    card: c => '<div class="card" data-r="' + c.星級 + '" data-t="char" data-k="' + c.id + '">' +
      '<div class="por"><img class="av" src="' + c.頭像 + '" alt="' + esc(c.名稱) + '" loading="lazy">' +
      '<div class="el" title="' + c.元素 + '元素">' + elIcon(c.元素) + '</div>' +
      '<div class="star">' + c.星級 + '★</div><div class="role">' + c.定位 + '</div></div>' +
      '<div class="nm"><b>' + c.名稱 + '</b><small>' + c.武器 + '</small></div></div>',
  },
  weapon: {
    data: W, ph: '搜尋武器名稱 / 效果…',
    sorts: [['rank','星級 → 類型'],['atk','基礎攻擊：高 → 低'],['newest','新增順序：新 → 舊'],['name','名稱']],
    groups: [
      { label:'類型', key:'類型', mode:'val', vals:WTYPE_ORDER },
      { label:'星級', key:'星級', mode:'val', vals:[5,4,3,2,1] },
      { label:'副屬性', key:'副屬性', mode:'val', vals:uniq(W.map(w => w.副屬性)) },
    ],
    search: w => [w.名稱, w.類型, w.副屬性, w.技能名, (w.精煉[0] || '').replace(/<[^>]+>/g, ''), w.描述].join(''),
    cmp: {
      rank:(a,b) => b.星級-a.星級 || WTYPE_ORDER.indexOf(a.類型)-WTYPE_ORDER.indexOf(b.類型) || b.id-a.id,
      atk: (a,b) => b.基礎攻擊-a.基礎攻擊,
      newest:(a,b) => b.id-a.id,
      name:(a,b) => a.名稱.localeCompare(b.名稱,'zh-Hant'),
    },
    card: w => '<div class="card" data-r="' + w.星級 + '" data-t="weapon" data-k="' + w.id + '">' +
      '<div class="por"><img class="eq" src="' + w.圖標 + '" alt="' + esc(w.名稱) + '" loading="lazy">' +
      '<div class="star">' + w.星級 + '★</div><div class="role">' + w.類型 + '</div></div>' +
      '<div class="nm"><b>' + w.名稱 + '</b><small>攻擊 ' + w.基礎攻擊 + '｜' + w.副屬性 + '</small></div></div>',
  },
  artifact: {
    data: A, ph: '搜尋聖遺物 / 套裝效果…',
    sorts: [['rank','星級 → 新增順序'],['name','名稱']],
    groups: [
      { label:'星級', key:'星級', mode:'val', vals:[5,4,3] },
      { label:'件數', key:'件數', mode:'val', vals:uniq(A.map(a => a.件數)).sort((x,y)=>y-x) },
    ],
    search: a => [a.名稱, a.二件, a.四件].join('').replace(/<[^>]+>/g, ''),
    cmp: {
      rank:(a,b) => b.星級-a.星級 || b.id-a.id,
      name:(a,b) => a.名稱.localeCompare(b.名稱,'zh-Hant'),
    },
    card: a => '<div class="card" data-r="' + a.星級 + '" data-t="artifact" data-k="' + a.id + '">' +
      '<div class="por"><img class="eq" src="' + a.圖標 + '" alt="' + esc(a.名稱) + '" loading="lazy">' +
      '<div class="star">' + a.星級 + '★</div><div class="role">' + a.件數 + ' 件</div></div>' +
      '<div class="nm"><b>' + a.名稱 + '</b><small>' + (a.二件 || '').replace(/<[^>]+>/g, '').slice(0, 14) + '</small></div></div>',
  },
};

let view = 'char', showTraveler = true, q = '', fnSrc = '全部';
const state = {}, sortKey = {};
Object.keys(VIEWS).forEach(v => { state[v] = {}; VIEWS[v].groups.forEach(g => state[v][g.key] = new Set()); sortKey[v] = VIEWS[v].sorts[0][0]; });
const fBox = $('filters');

function buildControls() {
  if (view === 'calc') { $('tools').style.display = 'none'; fBox.classList.remove('open'); fBox.innerHTML = ''; return; }
  $('tools').style.display = '';
  const V = VIEWS[view];
  $('q').placeholder = V.ph;
  $('sort').innerHTML = V.sorts.map(([k, t]) => '<option value="' + k + '"' + (k === sortKey[view] ? ' selected' : '') + '>' + t + '</option>').join('');
  $('trv').style.display = view === 'char' ? '' : 'none';
  fBox.innerHTML = V.groups.map(g =>
    '<div class="frow"><div class="flabel">' + g.label + '</div>' +
    g.vals.map(v => {
      const style = g.key === '元素' ? ' style="color:var(--e-' + v + ')"' : '';
      const txt = g.key === '星級' ? v + '★' : (g.key === '件數' ? v + ' 件' : v);
      return '<button class="chip' + (state[view][g.key].has(String(v)) ? ' on' : '') + '" data-k="' + g.key +
        '" data-v="' + v + '"' + style + '>' + (g.icon ? elIcon(v) : '') + txt + '</button>';
    }).join('') + '</div>' +
    (g.mode === 'fn'
      ? '<div class="frow"><div class="flabel">來源</div>' +
        ['全部','主動','被動','命座'].map(s => '<button class="chip src' + (s === fnSrc ? ' on' : '') + '" data-src="' + s + '">' + s + '</button>').join('') +
        '</div><div class="hint">功能標籤由技能／命座原文自動擷取；「加成」類只計算對隊友生效的效果。</div>'
      : '')
  ).join('') +
  // 底部收起條：手機上可以直接點這裡把篩選收回去，不用捲回最上面
  '<div class="fclose" id="fclose"><span class="fbar"></span>收起篩選 ▲</div>';
}

fBox.addEventListener('click', e => {
  if (e.target.closest('#fclose')) return setFilterOpen(false);
  const b = e.target.closest('.chip');
  if (!b) return;
  if (b.dataset.src) {
    fnSrc = b.dataset.src;
    fBox.querySelectorAll('.chip.src').forEach(x => x.classList.toggle('on', x === b));
  } else {
    const s = state[view][b.dataset.k];
    s.has(b.dataset.v) ? s.delete(b.dataset.v) : s.add(b.dataset.v);
    b.classList.toggle('on');
  }
  render();
});
$('nav').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  view = b.dataset.v;
  $('nav').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  $('q').value = ''; q = '';
  $('codex').style.display = view === 'calc' ? 'none' : '';
  $('calcview').style.display = view === 'calc' ? '' : 'none';
  buildControls();
  view === 'calc' ? renderCalc() : render();
};
function setFilterOpen(open) {
  fBox.classList.toggle('open', open);
  $('tgl').textContent = open ? '篩選條件 ▴' : '篩選條件 ▾';
  if (!open) window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('tgl').onclick = () => setFilterOpen(!fBox.classList.contains('open'));
$('trv').onclick = e => {
  showTraveler = !showTraveler;
  e.target.classList.toggle('on', showTraveler);
  e.target.textContent = showTraveler ? '顯示旅行者' : '隱藏旅行者';
  render();
};
$('rst').onclick = () => {
  Object.values(state[view]).forEach(s => s.clear());
  fnSrc = '全部'; $('q').value = ''; q = '';
  buildControls(); render();
};
$('q').oninput = e => { q = e.target.value.trim().toLowerCase(); render(); };
$('sort').onchange = e => { sortKey[view] = e.target.value; render(); };

function render() {
  if (view === 'calc') return;
  const V = VIEWS[view], st = state[view];
  const list = V.data.filter(o => {
    if (view === 'char' && !showTraveler && o.是旅行者) return false;
    for (const g of V.groups) {
      const s = st[g.key];
      if (!s.size) continue;
      if (g.mode === 'val') { if (!s.has(String(o[g.key]))) return false; }
      else if (g.mode === 'arr') { if (![...s].every(v => o[g.key].includes(v))) return false; }
      else { if (![...s].every(v => o.功能[v] && (fnSrc === '全部' || o.功能[v].includes(fnSrc)))) return false; }
    }
    if (q && !V.search(o).toLowerCase().includes(q)) return false;
    return true;
  }).sort(V.cmp[sortKey[view]]);
  $('grid').innerHTML = list.length ? list.map(V.card).join('')
    : '<div class="empty" style="grid-column:1/-1">找不到符合條件的項目</div>';
  const unit = { char:'名角色', weapon:'把武器', artifact:'套聖遺物' }[view];
  $('count').textContent = '顯示 ' + list.length + ' / ' + V.data.length + ' ' + unit +
    '　（5★ ' + list.filter(o => o.星級 === 5).length + '　4★ ' + list.filter(o => o.星級 === 4).length + '）';
}

// ── 詳情（含返回堆疊） ────────────────────────────────
let cur = null, curType = 'char', tab = '資料';
const stack = [];
$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  stack.length = 0;
  openBy(card.dataset.t, card.dataset.k);
});
function openBy(type, key) {
  const src = { char:D, weapon:W, artifact:A }[type];
  cur = src.find(o => o.id === key);
  curType = type;
  tab = TAB_SETS[type][0];
  openModal();
}
const matChip = m => '<span class="mat"><img src="images/item/' + m.圖標 + '.png" alt=""><b>' + m.名稱 + '</b>　<i>×' + m.數量 + '</i></span>';
// 配裝項目（帶圖示，可點擊）
function equipChip(name, i, type) {
  const clean = name.replace(/[0-9]/g, '').replace(/（.*?）/g, '').split('+')[0].trim();
  const o = type === 'weapon' ? wByName[name] : aByName[clean];
  const icon = o ? '<span class="ic"><img src="' + o.圖標 + '" alt=""></span>' : '';
  const sub = type === 'weapon'
    ? (o ? o.星級 + '★ ' + o.副屬性 : '')
    : (o ? o.星級 + '★ 套裝' + (name.match(/（(.*?)）/) ? ' · ' + name.match(/（(.*?)）/)[1] : '') : '散搭');
  return '<span class="bi link' + (i === 0 ? ' first' : '') + '" data-r="' + (o ? o.星級 : 4) + '"' +
    ' data-link="' + type + '" data-name="' + esc(name) + '">' + icon +
    '<span><b>' + name + '</b><i>' + sub + '</i></span></span>';
}

function tabInfo(c) {
  const fn = Object.entries(c.功能).map(([k, v]) => '<span class="tag fn">' + k + '<small style="opacity:.7"> ' + v.join('·') + '</small></span>').join('');
  return '<dl class="kv">' +
    '<dt>元素</dt><dd><span class="eline" style="color:var(--e-' + c.元素 + ')">' + elIcon(c.元素) + c.元素 + '元素 · ' + c.元素EN + '</span></dd>' +
    '<dt>武器</dt><dd>' + c.武器 + '</dd><dt>定位</dt><dd>' + c.定位 + '</dd>' +
    '<dt>性別</dt><dd>' + c.性別 + '</dd><dt>體型</dt><dd>' + c.體型 + '體型</dd>' +
    '<dt>年齡層</dt><dd>' + c.年齡層 + '</dd><dt>所屬</dt><dd>' + c.地區 + '</dd>' +
    '<dt>突破加成</dt><dd>' + c.突破加成 + (c.基礎面板 ? ' ' + c.基礎面板.突破加成值 : '') + '</dd>' +
    '<dt>生日</dt><dd>' + c.生日 + '</dd><dt>上線日</dt><dd>' + c.上線日 + '</dd></dl>' +
    (c.特殊體系.length ? '<div class="sec" style="margin-top:18px"><h3>特殊戰鬥體系</h3><div class="tags" style="margin:0">' +
      c.特殊體系.map(r => '<span class="tag re">' + r + '</span>').join('') +
      '</div><div class="hint" style="padding:6px 0 0">依角色的技能與命座原文有沒有提到該反應來判定，有提到就代表配得上這個體系。蒸發融化凍結這類一般反應人人可打，不另外標。</div></div>' : '') +
    (fn ? '<div class="sec"><h3>技能功能</h3><div class="tags" style="margin:0">' + fn + '</div></div>' : '') +
    (c.標籤.length ? '<div class="sec"><h3>機制標籤</h3><div class="tags" style="margin:0">' +
      c.標籤.map(t => '<span class="tag">' + t + '</span>').join('') + '</div></div>' : '');
}
function tabPanel(c) {
  if (!c.基礎面板) return '<div class="empty">沒有面板資料</div>';
  const b = c.基礎面板, s = c.有效詞條;
  return '<div class="sec"><h3>Lv90 基礎面板（不含武器與聖遺物）</h3><div class="stats">' +
      '<div class="stat"><small>生命值</small><b>' + b.生命值.toLocaleString() + '</b></div>' +
      '<div class="stat"><small>攻擊力</small><b>' + b.攻擊力 + '</b></div>' +
      '<div class="stat"><small>防禦力</small><b>' + b.防禦力 + '</b></div>' +
      '<div class="stat"><small>' + c.突破加成 + '</small><b>' + b.突破加成值 + '</b></div>' +
    '</div><div class="hint" style="padding:6px 0 0">由官方成長曲線計算，與遊戲內數值一致。傷害主要吃 <b style="color:var(--gold)">' + c.成長屬性 + '</b>。</div></div>' +
    statBlock(c) +
    (c.參考面板
      ? '<div class="sec"><h3>參考面板</h3><div class="goal"><span class="g2" style="margin:0;font-size:15px">' +
        c.參考面板 + '</span><span class="g3">來自社群統整表，基準為五星 0 命＋專武 1 精、四星滿命。</span></div></div>'
      : '') +
    '<div class="sec"><h3>本站試算（依固定假設）</h3>' +
      c.畢業目標.map(t => '<div class="goal"><span class="g1">' + t.項目 + '</span><span class="g2">' + t.值 +
        '</span><span class="g3">' + t.註 + '</span></div>').join('') +
      '<div class="warn" style="margin:12px 0 0">這一段是用固定假設算的：聖遺物 5 件滿級、主詞條照上面的有效詞條、副詞條給 25% 主屬性，並帶入推薦武器第一把與推薦聖遺物的 2 件效果。假設可在 <b>tools/build-stats.js</b> 的 ASSUME 調整。</div></div>';
}
// 有效詞條區塊（面板頁與配裝頁共用）
function statBlock(c) {
  const s = c.有效詞條;
  if (!s) return '';
  const q = arr => (arr || []).map((x, i) => '<span' + (i === 0 ? '' : ' style="background:#2b2f3f"') + '>' + x + '</span>').join('');
  return '<div class="sec"><h3>有效詞條推薦</h3><dl class="slots">' +
    '<dt>時之沙</dt><dd class="subq">' + q(s.沙) + '</dd>' +
    '<dt>空之杯</dt><dd class="subq">' + q(s.杯) + '</dd>' +
    '<dt>理之冠</dt><dd class="subq">' + q(s.冠) + '</dd>' +
    '<dt>副詞條</dt><dd class="subq"><span style="background:#2b2f3f;font-weight:600">' + s.副詞條 + '</span></dd>' +
    '</dl><div class="hint" style="padding:8px 0 0">每格左邊為首選，副詞條由左至右為優先度。生之花與死之羽主詞條固定，不用選。' +
    '（' + ({ '參考表':'來自社群統整表', '網路查證':'查證自攻略站，非本站推斷' }[s.來源] || '本站依技能文本推導') + '）</div></div>';
}
const fnBadge = arr => (arr && arr.length)
  ? '<span class="fnb">' + arr.map(f => '<span>' + f + '</span>').join('') + '</span>' : '';
function tabTalent(c) {
  if (!c.天賦.length) return '<div class="empty">沒有天賦資料</div>';
  const cls = k => k === '固有天賦' ? 'p' : (k === '普通攻擊' ? '' : 'a');
  return (c.天賦優先 ? '<div class="sec"><h3>天賦優先級</h3><div class="goal"><span class="g2" style="margin:0">' +
      c.天賦優先 + '</span><span class="g3">來自社群統整表；「視需求 可都不升」表示這名角色的天賦等級收益低。</span></div></div>' : '') +
    '<div class="sec">' + c.天賦.map(t =>
    '<div class="sk"><div class="skh"><span class="kind ' + cls(t.類型) + '">' + t.類型 + '</span>' +
      '<b class="nmm">' + t.名稱 + '</b>' +
      (t.冷卻 ? '<span class="cd">冷卻 ' + t.冷卻 + 's</span>' : '') +
      (t.消耗 ? '<span class="cd">耗能 ' + t.消耗 + '</span>' : '') +
      fnBadge(t.功能) +
    '</div><div class="txt">' + t.說明 + '</div></div>').join('') + '</div>';

// 依「起點→終點」算出需要的突破階段與經驗
function levelCost(from, to, promote, expTable, expPerMora) {
  const need = {}; let mora = 0, exp = 0;
  const [lv0, a0] = LV[from], [lv1, a1] = LV[to];
  promote.filter(p => p.階 > a0 && p.階 <= a1).forEach(p => {
    p.材料.forEach(m => need[m.id] = (need[m.id] || 0) + m.數量);
    mora += p.摩拉 || 0;
  });
  for (let l = lv0; l < lv1; l++) exp += expTable(l);
  mora += Math.round(exp / expPerMora);
  return { need, mora, exp };
}
function talentCost(from, to, table) {
  const need = {}; let mora = 0;
  table.forEach(p => {
    const lv = Number(p.等級.replace('→', ''));
    if (lv > from + 1 && lv <= to + 1) {
      p.材料.forEach(m => need[m.id] = (need[m.id] || 0) + m.數量);
      mora += p.摩拉 || 0;
    }
  });
  return { need, mora };
}
// 經驗轉換成經驗書／礦石（由大到小貼滿，最後一本無條件進位）
function expToBooks(exp, books) {
  const out = {}; let left = exp;
  books.forEach((b, i) => {
    const n = i === books.length - 1 ? Math.ceil(left / b.經驗) : Math.floor(left / b.經驗);
    if (n > 0) { out[b.id] = n; left -= n * b.經驗; }
  });
  return out;
}

function calcAll() {
  const need = {}; let mora = 0;
  const addNeed = o => { for (const k in o) need[k] = (need[k] || 0) + o[k]; };
  for (const g of goals) {
    const c = D.find(x => x.id === g.cid);
    if (!c) continue;
    const r = levelCost(g.lv[0], g.lv[1], c.突破素材, l => (EXPT.角色[l - 1] || 0), EXPT.角色摩拉比);
    addNeed(r.need); mora += r.mora;
    addNeed(expToBooks(r.exp, EXPT.角色經驗書));
    g.tal.forEach(t => { const x = talentCost(t[0], t[1], c.天賦素材); addNeed(x.need); mora += x.mora; });
    const w = W.find(x => x.id === g.wid);
    if (w && w.突破.length) {
      const maxI = LV.findIndex(l => l[0] === w.突破[w.突破.length - 1].上限 && l[1] === w.突破.length);
      const cap = maxI < 0 ? LV.length - 1 : maxI;
      const f = Math.min(g.wlv[0], cap), t = Math.min(g.wlv[1], cap);
      const wr = levelCost(f, t, w.突破, l => ((EXPT.武器[l - 1] || [])[w.星級 - 1] || 0), EXPT.武器摩拉比);
      addNeed(wr.need); mora += wr.mora;
      addNeed(expToBooks(wr.exp, EXPT.武器經驗礦));
    }
  }
  // 套用合成：低階多的可以 3 換 1 往上補
  const have = {}; for (const k in need) have[k] = Number(owned[k] || 0);
  for (const k in owned) if (!(k in have)) have[k] = Number(owned[k] || 0);
  const crafted = {};
  for (const ch of CHAINS) {
    if (!ch.some(id => need[id])) continue;
    for (let i = 0; i < ch.length - 1; i++) {
      const id = ch[i], up = ch[i + 1];
      const surplus = (have[id] || 0) - (need[id] || 0);
      if (surplus >= 3) {
        const made = Math.floor(surplus / 3);
        have[up] = (have[up] || 0) + made;
        have[id] -= made * 3;
        crafted[up] = (crafted[up] || 0) + made;
      }
    }
  }
  const rows = Object.keys(need).map(id => ({
    id, 名稱: (MAT[id] || {}).名稱 || id, 星級: (MAT[id] || {}).星級 || 1,
    圖標: (MAT[id] || {}).圖標 || '', 需求: need[id],
    持有: Number(owned[id] || 0), 合成: crafted[id] || 0,
    缺: Math.max(0, need[id] - (have[id] || 0)),
  }));

  // 依合成鏈分組，同一系列排在一起（低階 → 高階），方便看合成
  const chainOf = {};
  CHAINS.forEach((ch, i) => ch.forEach(id => chainOf[id] = i));
  const groups = new Map();
  rows.forEach(r => {
    const key = chainOf[r.id] !== undefined ? 'c' + chainOf[r.id] : 'x' + r.id;
    if (!groups.has(key)) groups.set(key, { key, 可合成: key[0] === 'c', rows: [] });
    groups.get(key).rows.push(r);
  });
  const out2 = [...groups.values()];
  out2.forEach(g => {
    if (g.可合成) {
      const order = CHAINS[Number(g.key.slice(1))];
      g.rows.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
      g.標題 = g.rows[0].名稱.replace(/(碎屑|斷片|塊|原質)$/, '') + ' 系列';
      g.缺 = g.rows.reduce((n, r) => n + r.缺, 0);
    } else {
      g.標題 = ''; g.缺 = g.rows[0].缺;
    }
    g.最高星 = Math.max(...g.rows.map(r => r.星級));
  });
  out2.sort((a, b) => (b.缺 > 0) - (a.缺 > 0) || b.最高星 - a.最高星 || b.rows.length - a.rows.length);
  return { rows, groups: out2, mora };
}

let onlyLack = false;
function renderCalc() {
  const { rows, groups, mora } = calcAll();
  const lvSel = (val, name, i) => '<select data-act="' + name + '" data-i="' + i + '">' +
    LV.map((l, j) => '<option value="' + j + '"' + (j === val ? ' selected' : '') + '>Lv' + lvLabel(j) + '</option>').join('') + '</select>';
  const talSel = (val, i, t, which) => '<select data-act="tal" data-i="' + i + '" data-t="' + t + '" data-w="' + which + '">' +
    Array.from({ length: 10 }, (_, j) => '<option value="' + j + '"' + (j === val ? ' selected' : '') + '>' + (j + 1) + '</option>').join('') + '</select>';

  const goalHTML = goals.map((g, i) => {
    const c = D.find(x => x.id === g.cid);
    if (!c) return '';
    const tn = c.天賦.filter(t => ['普通攻擊', '元素戰技', '元素爆發'].includes(t.類型)).map(t => t.類型);
    return '<div class="goalcard"><div class="gh" data-r="' + c.星級 + '">' +
      '<span class="ic"><img src="' + c.頭像 + '" alt=""></span><b>' + c.名稱 + '</b>' +
      '<span style="color:var(--dim);font-size:12px">' + c.元素 + '｜' + c.武器 + '</span>' +
      '<button class="del" data-act="del" data-i="' + i + '">移除</button></div>' +
      '<div class="grow"><span>角色等級</span><span class="gsel">' + lvSel(g.lv[0], 'lv0', i) +
        '<span class="arrow">→</span>' + lvSel(g.lv[1], 'lv1', i) + '</span></div>' +
      '<div class="grow"><span>天賦</span><div class="tal">' +
        g.tal.map((t, ti) => '<div><small>' + (tn[ti] || ('天賦' + (ti + 1))) + '</small>' +
          talSel(t[0], i, ti, 0) + ' <span class="arrow">→</span> ' + talSel(t[1], i, ti, 1) + '</div>').join('') +
      '</div></div>' +
      '<div class="grow"><span>武器</span><span class="gsel">' +
        (g.wid && wByName2[g.wid]
          ? '<span class="bi" style="padding:4px 10px 4px 4px"><span class="ic" style="width:30px;height:30px"><img src="' +
            wByName2[g.wid].圖標 + '" alt=""></span><span><b>' + wByName2[g.wid].名稱 + '</b><i>' +
            wByName2[g.wid].星級 + '★ ' + wByName2[g.wid].類型 + '</i></span></span>'
          : '<span style="color:var(--dim);font-size:12.5px">未選武器</span>') +
        '<button class="btn" data-act="pickw" data-i="' + i + '" style="padding:5px 10px">選武器</button>' +
        (g.wid ? '<button class="btn" data-act="clrw" data-i="' + i + '" style="padding:5px 10px">不計算</button>' : '') +
        '</span></div>' +
      (g.wid ? '<div class="grow"><span>武器等級</span><span class="gsel">' + lvSel(g.wlv[0], 'wlv0', i) +
        '<span class="arrow">→</span>' + lvSel(g.wlv[1], 'wlv1', i) + '</span></div>' : '') +
      '</div>';
  }).join('');

  const lackCount = rows.filter(r => r.缺 > 0).length;
  const rowHTML = r => '<div class="need"><img src="' + r.圖標 + '" alt="">' +
    '<span class="n1"><b>' + r.名稱 + '</b><small>' + r.星級 + '★・需要 ' + r.需求.toLocaleString() +
      (r.合成 ? ' ・<span class="craftnote">合成補 ' + r.合成 + '</span>' : '') + '</small></span>' +
    '<input type="number" min="0" value="' + (owned[r.id] || 0) + '" data-act="own" data-id="' + r.id + '">' +
    '<span class="lack ' + (r.缺 ? 'no' : 'ok') + '">' + (r.缺 ? '缺 ' + r.缺.toLocaleString() : '✓') + '</span></div>';
  const groupHTML = g => {
    const rs = onlyLack && g.缺 === 0 ? [] : g.rows;
    if (!rs.length) return '';
    return '<div class="mgroup">' +
      (g.可合成 ? '<div class="gt">🔁 ' + g.標題 + '<b>低階多的可 3→1 往上合成</b></div>' : '') +
      rs.map(rowHTML).join('') + '</div>';
  };

  $('calcview').innerHTML = '<div class="calcwrap">' +
    '<div class="panel"><h2>培養目標 <small>可以加多個角色，素材會一起算</small></h2>' +
      '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">' +
        '<button class="btn gold" id="addbtn">＋ 加入角色</button>' +
        '<button class="btn" id="clearall">清空全部</button></div>' +
      (goals.length ? goalHTML : '<div class="emptycalc">還沒有目標<br>按「＋ 加入角色」從圖示挑一個開始，預設是「現在 Lv1／天賦 1」練到「Lv90 ↑／天賦 10」<br>每一欄都能自己改</div>') +
    '</div>' +
    '<div class="panel"><h2>還缺的素材 <small>右邊填目前擁有數量</small></h2>' +
      (rows.length
        ? '<div class="sumrow"><span>摩拉</span><b>' + mora.toLocaleString() + '</b></div>' +
          '<div class="sumrow"><span>共 ' + rows.length + ' 種素材</span><b>' +
            (lackCount ? '還缺 ' + lackCount + ' 種' : '全部滿足 ✓') + '</b></div>' +
          '<div style="margin:12px 0 10px"><button class="btn' + (onlyLack ? ' on' : '') + '" id="onlylack">' +
            (onlyLack ? '只看還缺的' : '顯示全部') + '</button></div>' +
          groups.map(groupHTML).join('') +
          '<div class="hint" style="padding:10px 0 0">・同一系列的素材排在一起（低階在上），多出來的低階會自動 3→1 往上合成，已計入「合成補」。<br>' +
          '・經驗書與精鍛礦由所需經驗換算，最後一本無條件進位。<br>' +
          '・天賦素材以單一天賦的表計算，三個天賦分開設定；旅行者不同元素的天賦書略有差異。<br>' +
          '・設定會存在瀏覽器裡，下次打開還在。</div>'
        : '<div class="emptycalc">左邊加入目標後，這裡會列出還缺哪些素材</div>') +
    '</div></div>';

  if ($('addbtn')) $('addbtn').onclick = () => openPick('選要培養的角色',
    D.filter(c => !c.是旅行者 || c.名稱.includes('空')).sort((a, b) => b.星級 - a.星級 || a.名稱.localeCompare(b.名稱, 'zh-Hant')),
    VIEWS.char.card, id => { goals.push(newGoal(id)); save(); renderCalc(); });
  if ($('clearall')) $('clearall').onclick = () => { goals = []; owned = {}; save(); renderCalc(); };
  if ($('onlylack')) $('onlylack').onclick = () => { onlyLack = !onlyLack; renderCalc(); };

  $('calcview').querySelectorAll('[data-act]').forEach(el => {
    const act = el.dataset.act, i = Number(el.dataset.i);
    if (act === 'del') el.onclick = () => { goals.splice(i, 1); save(); renderCalc(); };
    else if (act === 'pickw') el.onclick = () => {
      const c = D.find(x => x.id === goals[i].cid);
      openPick('選 ' + c.名稱 + ' 的武器（' + c.武器 + '）',
        W.filter(w => w.類型 === c.武器).sort((a, b) => b.星級 - a.星級 || a.名稱.localeCompare(b.名稱, 'zh-Hant')),
        VIEWS.weapon.card, id => { goals[i].wid = id; save(); renderCalc(); });
    };
    else if (act === 'clrw') el.onclick = () => { goals[i].wid = ''; save(); renderCalc(); };
    else if (act === 'own') el.oninput = () => {
      owned[el.dataset.id] = Math.max(0, Number(el.value) || 0);
      save();
      const { rows: r2 } = calcAll();
      const row = r2.find(x => x.id === el.dataset.id);
      const box = el.parentElement.querySelector('.lack');
      box.textContent = row.缺 ? '缺 ' + row.缺.toLocaleString() : '✓';
      box.className = 'lack ' + (row.缺 ? 'no' : 'ok');
    };
    else el.onchange = () => {
      const v = Number(el.value) || 0;
      const g = goals[i];
      if (act === 'lv0') g.lv[0] = Math.min(v, g.lv[1]);
      else if (act === 'lv1') g.lv[1] = Math.max(v, g.lv[0]);
      else if (act === 'wlv0') g.wlv[0] = Math.min(v, g.wlv[1]);
      else if (act === 'wlv1') g.wlv[1] = Math.max(v, g.wlv[0]);
      else if (act === 'wid') g.wid = el.value;
      else if (act === 'tal') {
        const t = Number(el.dataset.t), w = Number(el.dataset.w);
        g.tal[t][w] = v;
        if (g.tal[t][0] > g.tal[t][1]) g.tal[t][w ? 1 : 0] = v;
      }
      save(); renderCalc();
    };
  });
}

$('sub').textContent = '角色 ' + D.length + ' 名 · 武器 ' + W.length + ' 把 · 聖遺物 ' + A.length +
  ' 套 · 素材 ' + Object.keys(MAT).length + ' 種 · 資料更新至 ' + D.map(c => c.上線日).sort().pop();
buildControls();
render();
</script>
</body>
</html>
